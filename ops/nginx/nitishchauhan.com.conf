server {
    server_name nitishchauhan.com www.nitishchauhan.com;

    root /opt/nitish-portfolio/dist;
    index index.html;

    location = /project-atlas {
        return 301 /project-atlas/;
    }

    location /project-atlas/ {
        try_files $uri $uri/ /project-atlas/index.html;
    }

    location = /clause-syntax {
        return 301 /clause-syntax/;
    }

    location /clause-syntax/ {
        try_files $uri $uri/ /clause-syntax/index.html;
    }

    location = /writes {
        return 301 /writes/;
    }

    location ^~ /writes/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nitishchauhan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nitishchauhan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.nitishchauhan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nitishchauhan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nitishchauhan.com www.nitishchauhan.com;
    return 404; # managed by Certbot




}
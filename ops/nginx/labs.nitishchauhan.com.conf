# Nitish Labs — static site at labs.nitishchauhan.com
# Root on VPS: /opt/nitish-labs
#
# First-time TLS:
#   certbot --nginx -d labs.nitishchauhan.com
# Certbot will typically rewrite this file to match cloud/chat
# (443 ssl + HTTP→HTTPS redirect). Keep the commented HTTPS block
# as a reference if you prefer to wire SSL manually.

server {
    server_name labs.nitishchauhan.com;

    root /opt/nitish-labs;
    # Prefer the modular homepage; source.html is the legacy single-file archive.
    index index.html source.html;

    # error_page 404 /404.html;  # no custom 404 with single-file labs

    # ACME / Certbot HTTP-01 readiness
    location /.well-known/acme-challenge/ {
        allow all;
    }

    # HTML: always revalidate so homepage/UI deploys show up without hard refresh fights
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Unfingerprinted CSS/JS: short cache, never immutable (immutable blocks updates at same URL)
    location ~* \.(js|css)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Fingerprinted/static media can stay longer
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/labs.nitishchauhan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/labs.nitishchauhan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


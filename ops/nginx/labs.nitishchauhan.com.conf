server {
    if ($host = labs.nitishchauhan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name labs.nitishchauhan.com;
    return 404; # managed by Certbot


}

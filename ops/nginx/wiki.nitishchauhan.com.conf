# Quartz knowledge bank (Curiosity Rooms)
# Root on VPS: /opt/quartz
# DNS: A wiki.nitishchauhan.com -> 200.97.169.13
#
# First-time TLS (after DNS propagates):
#   certbot --nginx -d wiki.nitishchauhan.com

server {
    listen 80;
    listen [::]:80;
    server_name wiki.nitishchauhan.com;

    root /opt/quartz;
    index index.html;

    error_page 404 /404.html;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# Quartz knowledge bank (Curiosity Rooms)
# Root on VPS: /opt/quartz
# DNS: A library -> 200.97.169.13 (TTL 300)
#
# First-time TLS (after DNS propagates):
#   certbot --nginx -d library.nitishchauhan.com

server {
    server_name library.nitishchauhan.com;

    root /opt/quartz;
    index index.html;

    error_page 404 /404.html;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/library.nitishchauhan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/library.nitishchauhan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = library.nitishchauhan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name library.nitishchauhan.com;
    return 404; # managed by Certbot


}
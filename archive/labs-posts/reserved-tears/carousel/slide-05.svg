<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
 <rect width="1080" height="1350" fill="#f7f5f1"/>
 <rect x="40" y="40" width="1000" height="1270" rx="36" fill="none" stroke="#d6d3d1" stroke-width="2"/>

 <text x="72" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#14213d">It Doesn&#39;t Hurt - But It Stings</text>
 <text x="72" y="230" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#4a5568">The quieter insight under the contrast.</text>
 <g transform="translate(72, 320)">
 <rect width="900" height="520" rx="24" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
 <text x="48" y="90" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#14213d">
 <tspan x="48" dy="0">1. Your pain scale may be different.</tspan>
 <tspan x="48" dy="52">2. That does not rank other people&#39;s lives.</tspan>
 <tspan x="48" dy="52">3. The lonely part is noticing your OS</tspan>
 <tspan x="48" dy="42"> is not the shared default.</tspan>
 <tspan x="48" dy="52">4. Hold the difference without turning it</tspan>
 <tspan x="48" dy="42"> into a hierarchy or a costume.</tspan>
 </text>
 </g>
 <g transform="translate(72, 880)">
 <rect width="900" height="140" rx="22" fill="#7c3aed"/>
 <text x="40" y="85" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Keep the threshold. Drop the Olympics.</text>
 </g>

 <text x="72" y="1260" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4a5568">NitishLabs · Visual Wiki Map · 5/5</text>
</svg>

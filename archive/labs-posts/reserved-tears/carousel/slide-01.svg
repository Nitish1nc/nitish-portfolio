 <text x="72" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#14213d">
 <tspan x="72" dy="0">I&#39;ve Reserved My Tears</tspan>
 <tspan x="72" dy="62">for Something Bigger</tspan>
 </text>
 <text x="72" y="420" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#4a5568">
 <tspan x="72" dy="0">When your crisis threshold recalibrates,</tspan>
 <tspan x="72" dy="40">calm can look like carelessness - </tspan>
 <tspan x="72" dy="40">and difference can look like distance.</tspan>
 </text>
 <g transform="translate(72, 620)">
 <rect width="900" height="160" rx="22" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
 <text x="40" y="70" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#14213d">
 <tspan x="40" dy="0">Thesis: resilience is often scar tissue,</tspan>
 <tspan x="40" dy="40">not a personality brand.</tspan>
 </text>
 </g>

 <text x="72" y="1260" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4a5568">NitishLabs · Visual Wiki Map · 1/5</text>

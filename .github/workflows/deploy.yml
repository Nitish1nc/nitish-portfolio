# Git-push deploy for the portfolio and Labs static sites.
# Secrets: SSH_PRIVATE_KEY (required), VPS_HOST (optional, default root@187.127.218.198).
# Mirrors scripts/deploy.sh and scripts/deploy-labs.sh. Skips writes:og (Playwright).

name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Build Labs CSS
        run: |
          if npm run | grep -q 'labs:css'; then
            npm run labs:css
          fi

      - name: Build nested Labs apps
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in apps/*/package.json; do
            app_dir="$(dirname "$pkg")"
            label="$(basename "$app_dir")"
            if [ ! -f "$app_dir/package.json" ]; then
              echo "Skipping ${label} (app folder not present)"
              continue
            fi
            if [ -f "$app_dir/package-lock.json" ]; then
              echo "Installing ${label}"
              if ! (cd "$app_dir" && npm ci); then
                echo "Skipping ${label} build (npm ci failed)"
                continue
              fi
            elif [ ! -d "$app_dir/node_modules" ]; then
              echo "Skipping ${label} build (no lockfile and node_modules missing)"
              continue
            fi
            echo "Building ${label}"
            if ! (cd "$app_dir" && npm run build); then
              echo "Warning: ${label} build failed. Deploying Labs with the existing bundle if present."
            fi
          done

      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y rsync

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          VPS_HOST="${VPS_HOST:-root@187.127.218.198}"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          rsync -avz --delete -e "ssh ${SSH_OPTS}" dist/ "${VPS_HOST}:/opt/nitish-portfolio/dist/"
          rsync -avz --delete -e "ssh ${SSH_OPTS}" labs/ "${VPS_HOST}:/opt/nitish-labs/"
          ssh ${SSH_OPTS} "$VPS_HOST" 'nginx -t && systemctl reload nginx'
